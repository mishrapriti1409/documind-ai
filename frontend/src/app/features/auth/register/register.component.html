<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="auth-logo">🧠</div>
      <h1>Create Organization Account</h1>
      <p>Set up DocuMind AI for your enterprise workspace</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      <span>⚠️ {{ errorMessage }}</span>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="orgName">Organization / Company Name</label>
        <input
          id="orgName"
          type="text"
          formControlName="organizationName"
          placeholder="Acme Global Inc."
        />
        <span class="form-error" *ngIf="registerForm.get('organizationName')?.touched && registerForm.get('organizationName')?.invalid">
          Organization name is required.
        </span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" formControlName="firstName" placeholder="Jane" />
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" formControlName="lastName" placeholder="Doe" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Work Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="jane@acme.com"
          autocomplete="email"
        />
        <span class="form-error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
          Valid email is required.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password (Min 8 Characters)</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="new-password"
        />
        <span class="form-error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
          Password must be at least 8 characters.
        </span>
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner" style="width: 16px; height: 16px;"></span>
        <span>{{ isLoading ? 'Creating account...' : 'Create Account' }}</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account? </span>
      <a routerLink="/auth/login">Sign in</a>
    </div>
  </div>
</div>
