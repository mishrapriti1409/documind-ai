<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="auth-logo">🧠</div>
      <h1>Sign in to DocuMind AI</h1>
      <p>Turn Enterprise Documents Into Actionable Intelligence</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      <span>⚠️ {{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Work Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="name@company.com"
          autocomplete="email"
        />
        <span class="form-error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Please enter a valid work email.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <span class="form-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password must be at least 8 characters.
        </span>
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner" style="width: 16px; height: 16px;"></span>
        <span>{{ isLoading ? 'Signing in...' : 'Sign In' }}</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>Need an organization account? </span>
      <a routerLink="/auth/register">Register organization</a>
    </div>
  </div>
</div>
